<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 3rem 1.25rem;
            background: #f3f6fb;
            color: #17233c;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: clamp(2rem, 7vw, 4.5rem);
            overflow: hidden;
            border: 1px solid #e4eaf3;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(27, 49, 83, 0.1);
        }
        .eyebrow {
            display: inline-block;
            margin: 0 0 1rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: #eaf2ff;
            color: #2458ad;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: clamp(2.25rem, 6vw, 3.5rem);
            letter-spacing: -0.05em;
            line-height: 1.08;
        }
        .description {
            max-width: 38rem;
            margin: 1rem 0 2rem;
            color: #64728a;
            font-size: 1.1rem;
            line-height: 1.7;
        }
        .summary {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
            padding: 1.25rem;
            border: 1px solid #e7edf5;
            border-radius: 16px;
            background: #f8faff;
        }
        .summary-number {
            display: grid;
            width: 3.25rem;
            height: 3.25rem;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 12px;
            background: #2458ad;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .summary p {
            margin: 0;
            color: #64728a;
            line-height: 1.5;
        }
        .summary strong {
            display: block;
            color: #17233c;
        }
        .button {
            display: inline-block;
            padding: 0.9rem 1.25rem;
            border-radius: 10px;
            background: #2458ad;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: background 150ms ease, transform 150ms ease;
        }
        .button:hover {
            transform: translateY(-1px);
            background: #19478f;
        }
        .button:focus-visible {
            outline: 3px solid #9fc2ff;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Panel de inventario</p>
        <h1>{{ title }}</h1>
        <p class="description">Consulta los productos, revisa sus existencias y prepara un reporte listo para compartir.</p>
        <section class="summary" aria-label="Resumen de productos">
            <span class="summary-number">{{ products_count }}</span>
            <p><strong>Productos en la lista</strong>Inventario de ejemplo disponible para consultar.</p>
        </section>
        <a class="button" href="/report">Ver lista de productos</a>
    </main>
</body>
</html>
